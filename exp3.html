<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Search Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f9;
        }
        h2 {
            color: #333;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
            width: 350px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        #profile {
            margin-top: 30px;
            padding: 20px;
            background: #e9f7ef;
            border-radius: 8px;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h2>Job Search Form</h2>
    <form id="jobForm">
        <label for="name">Full Name:</label>
        <input type="text" id="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <label for="role">Preferred Job Role:</label>
        <input type="text" id="role" required>

        <label for="location">Preferred Location:</label>
        <input type="text" id="location" required>

        <label for="experience">Experience (Years):</label>
        <input type="number" id="experience" min="0" required>

        <button type="submit">Submit</button>
    </form>

    <div id="profile">
        <h2>User Profile</h2>
        <p id="profileData">No data submitted yet.</p>
    </div>

    <script>
        document.getElementById("jobForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let role = document.getElementById("role").value;
            let location = document.getElementById("location").value;
            let experience = document.getElementById("experience").value;

            let profileInfo = `
                <strong>Name:</strong> ${name} <br>
                <strong>Email:</strong> ${email} <br>
                <strong>Preferred Role:</strong> ${role} <br>
                <strong>Location:</strong> ${location} <br>
                <strong>Experience:</strong> ${experience} years
            `;

            document.getElementById("profileData").innerHTML = profileInfo;
        });
    </script>

</body>
</html>
